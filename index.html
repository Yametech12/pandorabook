<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06070d" />
  <meta name="description" content="Pandora's Box — an interactive guide to AI agent behavioral models. Three archetypes, one framework." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta property="og:title" content="Pandora's Box" />
  <meta property="og:description" content="An interactive guide to AI agent behavioral models. Three archetypes, one framework." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/icons/icon-512.png" />
  <title>Pandora's Box</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PandoraBook" />

  <link rel="stylesheet" href="/css/app.css" />
  <!-- PWA perf: hint the browser that the data payload is needed ASAP -->
  <link rel="preload" href="/data/content.json" as="fetch" crossorigin="anonymous" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06070d" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <!-- Loading screen -->
  <div id="loader" role="status" aria-label="Loading Pandora's Box">
    <div class="loader-mark" aria-hidden="true">◈</div>
    <p class="loader-title">Pandora's Box</p>
    <p class="loader-sub">Preparing your workspace…</p>
  </div>

  <!-- App shell -->
  <div id="shell" hidden>
    <header class="app-header" id="appHeader">
      <div class="header-bar">
        <a href="#/home" class="brand" aria-label="PandoraBook — home">
          <span class="brand-mark" aria-hidden="true">◈</span>
          <span class="brand-wordmark">Pandora<em>Book</em></span>
        </a>
        <form class="header-searchbar" role="search" onsubmit="return headerSearchGo(event)" aria-label="Site search">
          <span class="searchbar-icon" aria-hidden="true">&#8981;</span>
          <input id="headerSearchInput" class="header-searchbar-input" type="search"
            placeholder="Search the library&hellip;  ( / )" aria-label="Search the library"
            autocomplete="off" spellcheck="false">
          <kbd class="searchbar-kbd" aria-hidden="true">/</kbd>
        </form>
        <div class="header-actions">
          <a href="#/saved" class="icon-btn header-link" data-intent="saved" aria-label="Saved bookmarks" title="Saved">
            <span aria-hidden="true">&#9733;</span>
          </a>
          <button id="installBtn" class="install-btn install-btn-compact" hidden type="button" aria-label="Install PandoraBook">
            <span class="install-icon" aria-hidden="true">&#11015;</span><span class="install-text">Install</span>
          </button>
          <a href="#/search" class="icon-btn header-search" data-intent="search" aria-label="Search the library" title="Search">
            <span aria-hidden="true">&#9906;</span>
          </a>
          <div class="more-wrap">
            <button type="button" class="icon-btn more-btn" id="moreBtn" data-intent="more"
                    aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu"
                    aria-label="More sections" title="More">
              <span aria-hidden="true">&#8943;</span>
            </button>
          <div class="more-menu" id="moreMenu" role="menu" aria-label="More sections" hidden>
            <a href="#/audit" class="more-link" role="menuitem" data-intent="more" data-hash="#/audit">Audit Report</a>
            <a href="#/sitemap" class="more-link" role="menuitem" data-intent="more" data-hash="#/sitemap">Site Map</a>
            <a href="#/changelog" class="more-link" role="menuitem" data-intent="more" data-hash="#/changelog">What&rsquo;s New</a>
          </div>
        </div>
      </div>
      </div>
      <!-- Task-oriented IA: Discover / Explore / Compare / Learn / Saved.
           Search lives in the header; lesser-used sections in More. -->
      <nav class="top-nav" aria-label="Primary">
        <a href="#/home" data-intent="home" class="top-link">Home</a>
        <a href="#/agents" data-intent="agents" class="top-link">Agents</a>
        <a href="#/compare" data-intent="compare" class="top-link">Compare</a>
        <a href="#/framework" data-intent="learn" class="top-link">Learn</a>
        <a href="#/saved" data-intent="saved" class="top-link">Saved</a>
      </nav>
    </header>

    <main id="app" tabindex="-1" aria-live="polite">
      <!-- Views are rendered here by /js/app.js -->
    </main>

    <nav class="bottom-nav" aria-label="Sections">
      <a href="#/home" data-intent="home" class="bottom-link" aria-label="Discover — home dashboard">
        <span class="bottom-icon" aria-hidden="true">&#8962;</span>
        <span class="bottom-label">Home</span>
      </a>
      <a href="#/agents" data-intent="agents" class="bottom-link" aria-label="Explore — agent profiles">
        <span class="bottom-icon" aria-hidden="true">&#9672;</span>
        <span class="bottom-label">Agents</span>
      </a>
      <a href="#/compare" data-intent="compare" class="bottom-link" aria-label="Compare agents side by side">
        <span class="bottom-icon" aria-hidden="true">&#8646;</span>
        <span class="bottom-label">Compare</span>
      </a>
      <a href="#/framework" data-intent="learn" class="bottom-link" aria-label="Learn — framework and glossary">
        <span class="bottom-icon" aria-hidden="true">&#11042;</span>
        <span class="bottom-label">Learn</span>
      </a>
      <a href="#/saved" data-intent="saved" class="bottom-link" aria-label="Saved bookmarks">
        <span class="bottom-icon" aria-hidden="true">&#9733;</span>
        <span class="bottom-label">Saved</span>
      </a>
    </nav>
    <button id="backTop" class="back-top" type="button" aria-label="Back to top" hidden>↑</button>
  </div>

    <noscript>
    <div class="noscript">
      <h1>Pandora's Box</h1>
      <p>This interactive web app requires JavaScript. Please enable JavaScript to explore the library.</p>
    </div>
  </noscript>

  <!-- Install prompt card (shown after engagement; see wireInstallButton) -->
  <div id="installBanner" class="install-banner" hidden role="dialog" aria-label="Install PandoraBook">
    <div class="install-banner-inner">
      <button id="installBannerDismiss" class="install-banner-close" type="button" aria-label="Dismiss install prompt">×</button>
      <img class="install-banner-icon" src="/icons/icon-192.png" alt="" width="56" height="56" />
      <div class="install-banner-text">
        <strong>PandoraBook</strong>
        <span class="install-banner-sub">Pandora's Box · AI Agent Models</span>
        <span class="install-banner-meta">Free · Works offline</span>
      </div>
      <button id="installBannerBtn" class="install-banner-get" type="button">GET</button>
    </div>
  </div>

  <!-- Share toast -->
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="/js/app.js" defer></script>
  <script>
    // Register the service worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
